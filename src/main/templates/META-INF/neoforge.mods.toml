# AnvilCraft: Spears — mod metadata
# 字段会在构建时由 gradle/scripts/resources.gradle 用 gradle.properties 的值替换。
modLoader = "javafml" #mandatory
loaderVersion = "${loader_version_range}" #mandatory
license = "${mod_license}" #mandatory
# 问题反馈地址
issueTrackerURL = "https://github.com/PigeonNian/AnvilCraftSpears/issues" #optional

[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${mod_version}" #mandatory
displayName = "${mod_name}" #mandatory
# 模组主页
displayURL = "https://github.com/PigeonNian/AnvilCraftSpears" #optional
# 模组图标（jar 根目录）
logoFile = "${mod_id}.png" #optional
authors = "${mod_authors}" #optional
description = '''${mod_description}'''

# Mixin 配置
[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies."${mod_id}"]] #optional
modId = "neoforge" #mandatory
type = "required" #mandatory
versionRange = "${neo_version_range}" #mandatory
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# AnvilLib —— Registrum 注册框架，AnvilCraft 本体也依赖它。
[[dependencies."${mod_id}"]]
modId = "anvillib"
type = "required"
versionRange = "[2.0.0,)"
ordering = "NONE"
side = "BOTH"

# AnvilCraft 本体（ModItems / ModTiers / HeavyHalberdItem 等 API）。
# AFTER 保证它的注册表先于本模组初始化。
[[dependencies."${mod_id}"]]
modId = "anvilcraft"
type = "required"
versionRange = "[1.6.0,)"
ordering = "AFTER"
side = "BOTH"

# Backported Spears：本模组直接使用它的数据组件与音效。
# 编译目标是 1.8.0，因此最低版本锁定到 1.8.0；AFTER 保证组件先注册。
[[dependencies."${mod_id}"]]
modId = "spears"
type = "required"
versionRange = "[1.8.0,)"
ordering = "AFTER"
side = "BOTH"
