name: Pull Request Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - gradle/scripts/**
      - src/**
      - build.gradle
      - dependencies.gradle
      - gradle.properties
      - settings.gradle

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: pr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Properties
        id: properties
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'mod_id mod_name java_version'

      - name: Setup Java ${{ steps.properties.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ steps.properties.outputs.java_version }}

      - name: Make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Get Version
        id: version
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | grep -v -- '-shadow' | grep -v -- '-slim' | head -n 1)
          MESSAGE=$(basename "$JAR" .jar)
          MESSAGE=${MESSAGE#"${{ steps.properties.outputs.mod_id }}-neoforge-"}
          echo "version=$MESSAGE" >> "$GITHUB_OUTPUT"

      - name: Get Artifact Name
        id: artifact_name
        run: |
          NAME=$(echo "${{ steps.properties.outputs.mod_name }} ${{ steps.version.outputs.version }}" | sed 's/["\\:<>|*?\/]//g')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.artifact_name.outputs.name }}"
          path: build/libs/${{ steps.properties.outputs.mod_id }}-neoforge-${{ steps.version.outputs.version }}.jar
