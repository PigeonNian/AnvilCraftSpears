plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    alias libs.plugins.modDevGradle
}

// 版本号只有一个来源：gradle.properties 里的 mod_version。
// - 打 tag 发版时（refs/tags/v1.0.0 -> 1.0.0），tag 必须与 mod_version 完全一致；
// - CI 快照构建追加 build 元数据（<mod_version>+<buildType>.<run_number>）；
// - 本地构建直接使用 <mod_version>，与仓库里的版本号保持一致。
String buildNumber = System.getenv("GITHUB_RUN_NUMBER")
String buildTypeEnv = System.getenv("BUILD_TYPE")
String buildType
switch (buildTypeEnv) {
    case 'pr':
        buildType = 'pr'
        break
    case 'hotfix':
        buildType = 'hotfix'
        break
    case 'snapshot':
        buildType = 'snapshot'
        break
    case 'release':
        buildType = null
        buildNumber = null
        break
    default:
        buildType = 'build'
}

String tagVersion = null
def githubRef = System.getenv("GITHUB_REF")
if (githubRef != null && githubRef.startsWith("refs/tags/")) {
    tagVersion = githubRef.substring("refs/tags/".length())
    if (tagVersion.startsWith("v")) {
        tagVersion = tagVersion.substring(1)
    }
    if (tagVersion != mod_version) {
        throw new GradleException(
            "Tag '${tagVersion}' does not match mod_version='${mod_version}' in gradle.properties. " +
                "Bump mod_version before tagging a release."
        )
    }
}

version = tagVersion != null
    ? tagVersion
    : "${mod_version}" + (buildNumber != null ? "+${buildType}.${buildNumber}" : "")
group = maven_group

apply from: "$rootDir/gradle/scripts/moddevgradle.gradle"
apply from: "$rootDir/gradle/scripts/repositories.gradle"
apply from: "$rootDir/gradle/scripts/jars.gradle"
apply from: "$rootDir/gradle/scripts/publishing.gradle"
apply from: "$rootDir/gradle/scripts/resources.gradle"
apply from: "$rootDir/dependencies.gradle"

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
compileJava.options.encoding = 'UTF-8'

// 资源（模型/语言/配方/标签）都手写在 src/main/resources 里，因此默认不启用 src/generated/resources。
// 若以后改用 runData 生成资源，取消下面这行注释，并删掉 src/main/resources 下与生成物同名的文件，
// 否则 jar 内会出现重复条目。
// sourceSets.main.resources { srcDir 'src/generated/resources' }

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
